<header class="mt-8 mb-24 md:flex justify-between items-center px-4 md:px-0">
  <div class="font-medium">
    <a routerLink="/" class="inline-block -ml-2 px-2 py-1 rounded-lg font-semibold transition">
      {{ siteData()?.siteName }}
    </a>
  </div>

  <div class="flex items-center gap-4">
    <nav class="text-sm text-slate-600 font-medium space-x-4">
      @for (link of siteData()?.navLinks ?? []; track link.path) {
        <a [routerLink]="link.path"
           routerLinkActive=""
           class="underline hover:no-underline">
          {{ link.label }}
        </a>
      }
    </nav>

    <button
      (click)="themeService.toggle()"
      [attr.aria-pressed]="themeService.isDark()"
      aria-label="Toggle dark mode"
      class="p-1.5 rounded-lg text-slate-500 transition">
      @if (themeService.isDark()) {
        <!-- Sun icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
      } @else {
        <!-- Moon icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
      }
    </button>
  </div>
</header>
