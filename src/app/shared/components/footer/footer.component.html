<footer class="text-sm text-center mt-20 mb-8 px-4 md:px-0">
  <nav class="mx-auto flex flex-col justify-center items-center gap-2">
    <div class="inline-flex flex-wrap space-x-4 text-slate-600">
      @for (link of siteData()?.footerSocialLinks ?? []; track link.name) {
        <a [href]="link.url" [attr.rel]="link.rel || null" class="underline hover:no-underline">
          {{ link.name }}
        </a>
      }
    </div>
    <div class="inline-flex flex-wrap space-x-4 text-slate-600">
      @for (link of siteData()?.footerSecondaryLinks ?? []; track link.name) {
        <a [href]="link.url" class="underline hover:no-underline">
          {{ link.name }}
        </a>
      }
    </div>
  </nav>
  <div class="mt-3 text-xs text-slate-500">
    &copy; 2012 - {{ currentYear }} Stefan Zweifel
  </div>
</footer>
