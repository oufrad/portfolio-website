<footer class="page">
  <nav aria-label="Elsewhere">
    @for (link of siteData()?.footerSocialLinks ?? []; track link.name) {
      <a [href]="link.url" [attr.rel]="link.rel || null">{{ link.name }}</a>
    }
  </nav>

  <p class="copyright">&copy; {{ currentYear }} {{ siteData()?.siteName }}</p>
</footer>
