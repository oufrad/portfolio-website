<section class="hero">
  <app-ascii-field />

  @if (homeData(); as data) {
    <div class="hero-inner page">
      <h1>{{ data.name }}</h1>
      <p class="role">{{ data.title }}</p>

      <div class="bio">
        @for (paragraph of data.bio; track paragraph) {
          <p [innerHTML]="paragraph"></p>
        }
      </div>

      <ul class="links">
        @for (link of data.socialLinks; track link.name) {
          <li><a [href]="link.url">{{ link.name }}</a></li>
        }
      </ul>
    </div>
  }
</section>
